name = "oncovo-api"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Placeholder para D1 LOCAL sem conta. Antes do deploy, criar D1 real e SUBSTITUIR o UUID.
[[d1_databases]]
binding = "DB"
database_name = "oncovo-db"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
# Inserir a origem exata do Pages na Cloudflare (sem barra final) antes do deploy.
# Exemplo: https://oncovo.pages.dev,http://localhost:4321
ALLOWED_ORIGINS = "http://localhost:4321,http://127.0.0.1:4321"
